name: Build Keygate - Alpine ARMv7

on:
  workflow_dispatch:
  push:
    tags:
      - "armv7-*"

permissions:
  contents: read

concurrency:
  group: build-armv7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Linux ARMv7 / Alpine
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      GOOS: linux
      GOARCH: arm
      GOARM: "7"
      CGO_ENABLED: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build frontend
        run: |
          cd web
          bun install --frozen-lockfile
          bun run build

      - name: Download Go dependencies
        run: go mod download

      - name: Cross compile ARMv7
        run: |
          mkdir -p bin

          VERSION=$(git describe --tags --always 2>/dev/null || echo dev)
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          go build \
            -trimpath \
            -ldflags "\
              -X github.com/tabloy/keygate/internal/version.Version=${VERSION} \
              -X github.com/tabloy/keygate/internal/version.Commit=${COMMIT} \
              -X github.com/tabloy/keygate/internal/version.BuildDate=${BUILD_DATE}" \
            -o bin/keygate \
            ./cmd/server

      - name: Verify binary
        run: |
          file bin/keygate
          readelf -h bin/keygate

          readelf -h bin/keygate | grep -q 'ELF32'
          readelf -h bin/keygate | grep -q 'ARM'

      - name: Package release
        run: |
          mkdir -p release/keygate

          cp bin/keygate release/keygate/
          cp .env.example release/keygate/
          cp -r db/migrations release/keygate/
          cp -r web/dist release/keygate/

          cat > release/keygate/BUILD-INFO.txt <<EOF
          Project: Keygate
          OS: Linux
          Target: Alpine Linux
          Architecture: ARMv7 32-bit
          GOOS: linux
          GOARCH: arm
          GOARM: 7
          CGO_ENABLED: 0
          Database: External PostgreSQL
          Commit: $(git rev-parse --short HEAD)
          EOF

          tar -czf keygate-alpine-armv7.tar.gz \
            -C release keygate

          sha256sum keygate-alpine-armv7.tar.gz \
            > keygate-alpine-armv7.tar.gz.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: keygate-alpine-armv7
          path: |
            keygate-alpine-armv7.tar.gz
            keygate-alpine-armv7.tar.gz.sha256
          retention-days: 30
